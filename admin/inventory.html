<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory Management — NeoFragrances</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<div class="admin-body">
  <div class="admin-sidebar">
    <a href="index.html" class="logo"><img src="../images/logo/logo.png" alt="NeoFragrances" style="height:70px; width:auto;"></a>
    <nav class="admin-nav">
      <a href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
      <a href="products.html"><i class="fa-solid fa-flask"></i> Products</a>
      <a href="inventory.html" class="active"><i class="fa-solid fa-boxes-stacked"></i> Inventory<span class="nav-badge" id="low-stock-badge"></span></a>
      <a href="orders.html"><i class="fa-solid fa-bag-shopping"></i> Orders</a>
      <a href="customers.html"><i class="fa-solid fa-users"></i> Customers</a>
      <a href="reports.html"><i class="fa-solid fa-chart-line"></i> Reports</a>
      <div class="divider"></div>
      <a href="../index.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </nav>
  </div>

  <div class="admin-main">

      <div>

      </div>

          <tr><th>Product</th><th>Quantity</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody id="inventory-table-body"></tbody>
      </table>

  </div>

<script src="../js/main.js"></script>
<script src="../js/toast.js"></script>
<script src="../js/auth.js"></script>
