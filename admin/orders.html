<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Management — NeoFragrances</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<div class="admin-body">
  <div class="admin-sidebar">
    <a href="index.html" class="logo"><img src="../images/logo/logo.png" alt="NeoFragrances" style="height:70px; width:auto;"></a>
    <nav class="admin-nav">
      <a href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
      <a href="products.html"><i class="fa-solid fa-flask"></i> Products</a>
      <a href="inventory.html"><i class="fa-solid fa-boxes-stacked"></i> Inventory <span class="nav-badge" id="low-stock-badge"></span></a>
      <a href="orders.html" class="active"><i class="fa-solid fa-bag-shopping"></i> Orders</a>
      <a href="customers.html"><i class="fa-solid fa-users"></i> Customers</a>
      <a href="reports.html"><i class="fa-solid fa-chart-line"></i> Reports</a>
      <div class="divider"></div>
      <a href="../index.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </nav>
  </div>

  <div class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1>Order Management</h1>
        <div class="admin-sub">View orders and update their status.</div>
      </div>
      <div class="admin-user"><div class="avatar">A</div> Admin</div>
    </div>

    <div class="admin-toolbar">
      <button class="btn btn-outline btn-sm" onclick="exportOrdersCSV()"><i class="fa-solid fa-file-arrow-down"></i>&nbsp; Export CSV</button>
      <select id="order-status-filter" class="filter-select">
        <option value="all">All Statuses</option>
        <option value="Pending">Pending</option>
        <option value="Processing">Processing</option>
        <option value="Shipped">Shipped</option>
        <option value="Delivered">Delivered</option>
        <option value="Cancelled">Cancelled</option>
      </select>
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr><th>Order ID</th><th>Customer</th><th>Date</th><th>Items</th><th>Total</th><th>Contact</th><th>Status</th></tr>
        </thead>
        <tbody id="orders-table-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="../js/main.js"></script>
<script src="../js/toast.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
