<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Management — NeoFragrances</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<div class="admin-body">
  <div class="admin-sidebar">
    <a href="index.html" class="logo"><img src="../images/logo/logo.png" alt="NeoFragrances" style="height:70px; width:auto;"></a>
    <nav class="admin-nav">
      <a href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
      <a href="products.html" class="active"><i class="fa-solid fa-flask"></i> Products</a>
      <a href="inventory.html"><i class="fa-solid fa-boxes-stacked"></i> Inventory <span class="nav-badge" id="low-stock-badge"></span></a>
      <a href="orders.html"><i class="fa-solid fa-bag-shopping"></i> Orders</a>
      <a href="customers.html"><i class="fa-solid fa-users"></i> Customers</a>
      <a href="reports.html"><i class="fa-solid fa-chart-line"></i> Reports</a>
      <div class="divider"></div>
      <a href="../index.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </nav>
  </div>

  <div class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1>Product Management</h1>
        <div class="admin-sub">Add, edit, or remove fragrances from your catalog.</div>
      </div>
      <div class="admin-user"><div class="avatar">A</div> Admin</div>
    </div>

    <div class="admin-toolbar">
      <div class="search-box" style="max-width:320px;">
        <i class="fa-solid fa-magnifying-glass" style="color:var(--ink-soft)"></i>
        <input type="text" id="admin-product-search" placeholder="Search products...">
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-outline btn-sm" onclick="exportProductsCSV()"><i class="fa-solid fa-file-arrow-down"></i>&nbsp; Export CSV</button>
        <button class="btn btn-primary btn-sm" onclick="openProductModal()"><i class="fa-solid fa-plus"></i>&nbsp; Add Product</button>
      </div>
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr><th>Product</th><th>Brand</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr>
        </thead>
        <tbody id="products-table-body"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Add / Edit Product Modal -->
<div class="modal-overlay" id="product-modal-overlay">
  <div class="modal">
    <button class="modal-close" onclick="closeProductModal()"><i class="fa-solid fa-xmark"></i></button>
    <h3 id="product-modal-title">Add Product</h3>
    <form id="product-form">
      <div class="field">
        <label>Product Name</label>
        <input type="text" name="pname" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Brand</label>
          <input type="text" name="pbrand" required>
        </div>
        <div class="field">
          <label>Category</label>
          <select name="pcategory">
            <option value="men">Men's</option>
            <option value="women">Women's</option>
            <option value="unisex">Unisex</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Price ($)</label>
          <input type="number" name="pprice" min="0" step="0.01" required>
        </div>
        <div class="field">
          <label>Stock Status</label>
          <select name="pstock">
            <option value="true">In Stock</option>
            <option value="false">Out of Stock</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Badge</label>
        <select name="pbadge">
          <option value="">None</option>
          <option value="New">New</option>
          <option value="Bestseller">Bestseller</option>
        </select>
      </div>
      <div class="field">
        <label>Image Path</label>
        <input type="text" name="pimage" placeholder="images/perfumes/your-file.jpg">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" onclick="closeProductModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Product</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/main.js"></script>
<script src="../js/toast.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
