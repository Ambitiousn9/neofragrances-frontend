<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — NeoFragrances</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<header class="site-header">
  <div class="container navbar">
    <a href="index.html" class="logo">Neo<span>Fragrances</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-icons">
      <a href="cart.html" title="Cart"><i class="fa-solid fa-bag-shopping"></i><span class="cart-count">0</span></a>
      <button class="nav-toggle" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
    </div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Create an Account</h1>
    <p class="sub">Join NeoFragrances for faster checkout and order tracking.</p>

    <form onsubmit="return false;">
      <div class="field">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" placeholder="Ama Owusu" required>
      </div>
      <div class="field">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" placeholder="+233 55 000 0000" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" placeholder="••••••••" required>
        </div>
        <div class="field">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" placeholder="••••••••" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:10px;">Create Account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
  </div>
</div>

<script src="js/main.js"></script>
<script src="js/cart.js"></script>
<script src="js/validation.js"></script>
<script src="js/auth.js"></script>
<script src="js/validation.js"></script>
</body>
</html>
