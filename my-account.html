<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — NeoFragrances</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<header class="site-header">
  <div class="container navbar">
    <a href="index.html" class="logo"><img src="images/logo/logo.png" alt="NeoFragrances" style="height:50px; width:auto;"></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li class="mobile-account-item"><a href="login.html"><i class="fa-regular fa-user"></i> &nbsp;Login / Register</a></li>
      <li class="mobile-account-item"><a href="wishlist.html"><i class="fa-regular fa-heart"></i> &nbsp;Wishlist</a></li>
      <li class="mobile-account-item"><a href="my-orders.html"><i class="fa-solid fa-receipt"></i> &nbsp;My Orders</a></li>
    </ul>
    <div class="nav-icons">
      <a href="products.html" title="Search"><i class="fa-solid fa-magnifying-glass"></i></a>
      <a href="login.html" title="Login / Register" class="icon-secondary"><i class="fa-regular fa-user"></i></a>
      <a href="wishlist.html" title="Wishlist" class="icon-secondary"><i class="fa-regular fa-heart"></i></a>
      <a href="my-orders.html" title="My Orders" class="icon-secondary"><i class="fa-solid fa-receipt"></i></a>
      <a href="cart.html" title="Cart"><i class="fa-solid fa-bag-shopping"></i><span class="cart-count">0</span></a>
      <button class="nav-toggle" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
    </div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>My Account</h1>
    <p class="sub">Your NeoFragrances profile.</p>
    <div id="account-details"></div>
    <div style="margin-top:28px; display:flex; flex-direction:column; gap:12px;">
      <a href="my-orders.html" class="btn btn-outline btn-block">View My Orders</a>
      <a href="wishlist.html" class="btn btn-outline btn-block">View My Wishlist</a>
      <button class="btn btn-block" id="account-logout-btn" style="background:#C0392B; color:white; border:none;">Logout</button>
    </div>
  </div>
</div>

<script src="js/main.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
  <link rel="stylesheet" href="css/mobile-drawer.css">
<script src="js/mobile-drawer.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const wrap = document.getElementById("account-details");
  const auth = getAuth();
  if (!auth || !auth.user) {
    window.location.href = "login.html";
    return;
  }
  wrap.innerHTML = `
    <div class="field"><label>Full Name</label><div style="padding:12px 14px; background:var(--bg); border-radius:4px; font-size:14px;">${auth.user.full_name}</div></div>
    <div class="field"><label>Email</label><div style="padding:12px 14px; background:var(--bg); border-radius:4px; font-size:14px;">${auth.user.email}</div></div>
  `;
  document.getElementById("account-logout-btn").addEventListener("click", () => {
    if (confirm("Log out of your account?")) logoutUser();
  });
});
</script>
</body>
</html>
