<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — NeoFragrances</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<header class="site-header">
  <div class="container navbar">
    <a href="index.html" class="logo"><img src="images/logo/logo.png" alt="NeoFragrances" style="height:50px; width:auto;"></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-icons">
      <a href="cart.html" title="Cart"><i class="fa-solid fa-bag-shopping"></i><span class="cart-count">0</span></a>
      <button class="nav-toggle" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
    </div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Reset Password</h1>
    <p class="sub">Choose a new password for your account.</p>

    <form id="reset-form">
      <div class="field">
        <label for="rp-password">New Password</label>
        <input type="password" id="rp-password" placeholder="••••••••" required>
      </div>
      <div class="field">
        <label for="rp-confirm">Confirm Password</label>
        <input type="password" id="rp-confirm" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
    </form>

    <div id="rp-result" style="margin-top:20px;"></div>
  </div>
</div>

<script src="js/main.js"></script>
<script src="js/cart.js"></script>
<script src="js/password-reset.js"></script>
</body>
</html>
